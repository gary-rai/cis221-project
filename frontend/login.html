
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogWatch | Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<!-- This is the main login page -->
<div class="login-container">

<!-- This displays the website logo -->
<div class="login-brand">
<img src="../images/logo-watch.png" alt="LogWatch Logo">
</div>


<!-- This displays the login box -->
<div class="login-card">

<div class="login-heading">
<h1>Welcome Back</h1>
<p>Sign in to access your security dashboard.</p>
</div>


<!-- This is the login form -->
<form id="loginForm">

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="username" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
</div>

<p id="loginError" class="error-message" role="alert"></p>

<button type="submit" class="login-button">Sign In</button>

</form>



<!-- This displays information below the login form -->
<div class="security-info">
<p>Secure access to your LogWatch dashboard</p>
</div>


</div>


<!-- This displays the footer -->
<div class="login-footer">
<p>LogWatch Security Platform</p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
